# ============================================================
# 主配置：图编排 / 检索 / 模型 / 功能开关
# 所有数值都允许被同名环境变量覆盖，占位语法 ${VAR:-default}
# 由 config/loader.py 统一解析，禁止在业务代码里直接读本文件
# ============================================================

app:
  mode: ${APP_MODE:-fixture}
  log_level: ${LOG_LEVEL:-INFO}
  # memory = 进程内字典（测试默认）；postgres = 任务台账与报告落库，需要 POSTGRES_DSN
  job_store: ${JOB_STORE:-memory}

graph:
  # 循环终止：唯一依据是 retry_count，禁止让模型自行判断"够了"
  max_retry: 2
  sections:
    - company
    - industry
    - financial
    - news
  evidence:
    min_relevance_score: 0.4      # 沿用原版 curator 阈值，改为可配置
    min_docs_per_section: 2       # 低于此数判定 insufficient
    require_source_url: true      # 无 URL 的文档直接丢弃
  competitor_fetch:
    # 行业栏目两阶段检索：第一轮扫出竞品名单，第二轮按竞品名补查事实。
    # 每条竞品 = 1 次检索（advanced = 2 credits），直接计入额度；0 表示关闭第二阶段。
    enabled: ${COMPETITOR_FETCH:-true}
    max_competitors: ${MAX_COMPETITORS:-3}
  degrade:
    # 防幻觉是红线，降级不可关闭；这里只配置拒答话术
    message: "该类信息未找到公开依据"
  checkpointer: ${CHECKPOINTER:-sqlite}
  dsn: ${DATABASE_URL:-sqlite:///./data/checkpoints.db}
  postgres_dsn: ${POSTGRES_DSN:-}
  thread_id_template: "{company}:{date}"

retrieval:
  # 每栏每轮生成几条 query。**直接决定花费**：N 条 = 每轮 4N 次检索 = 8N credits。
  # 默认 1（每轮 4 次检索 / 8 credits）；调到 2 素材翻倍、花费也翻倍。
  # 注意：2026-11-15 之前这个值是 2，但代码从没读过它（每栏实际只发 1 条），已接上。
  queries_per_analyst: ${QUERIES_PER_ANALYST:-1}
  # 每个 query 取几条结果。**不影响 credits**（按检索次数计费），只影响素材量与 token
  max_results_per_query: ${MAX_RESULTS_PER_QUERY:-5}
  search_depth: ${SEARCH_DEPTH:-advanced}
  topics:
    financial_analyzer: finance
    news_analyzer: news
  rerank:
    enabled: true
    # 预留：后续 A/B 用，先不引入额外依赖
    strategy: score_desc
  live:
    # ⚠️ Tavily 免费额度护栏：默认全关，装了 key 也调不动。
    # 真实调用需同时满足 APP_MODE=live + TAVILY_LIVE_ENABLED=true + TAVILY_MAX_CALLS>0。
    # 缓存命中不扣额度；dry_run 只记录 query，0 次真实请求。
    enabled: ${TAVILY_LIVE_ENABLED:-false}
    max_calls_per_run: ${TAVILY_MAX_CALLS:-0}
    dry_run: ${TAVILY_DRY_RUN:-false}
    cache_dir: ${TAVILY_CACHE_DIR:-./evals/cache/tavily}

models:
  temperature: 0
  max_retries: 1                  # 结构化输出校验失败后的重试次数
  roles:
    # LLM_MODEL 由运行环境指定（阿里云百炼用 qwen-plus，OpenRouter 用
    # google/gemini-3.8-flash）；默认值保持上游原样，不改动历史行为。
    research: ${LLM_MODEL:-google/gemini-3.8-flash}
    briefing: ${LLM_MODEL:-google/gemini-3.8-flash}
    editor: ${LLM_MODEL:-google/gemini-3.8-flash}
    judge: ${LLM_MODEL:-google/gemini-3.8-flash}
  fixture:
    # fixture 模式下不调用任何外部模型，返回确定性结构化输出
    stub: true
    responses_path: ${FIXTURE_PATH:-./evals/fixtures/tavily_responses.json}

features:
  # 四项 A/B 开关均可用同名环境变量覆盖，供 evals/run_eval.py 与命令行做对照实验
  self_correction: ${FEATURES_SELF_CORRECTION:-true}       # 条件边回退总开关（S3 已生效）
  structured_output: ${FEATURES_STRUCTURED_OUTPUT:-true}   # with_structured_output（S5 生效）
  inline_citations: ${FEATURES_INLINE_CITATIONS:-true}     # 行内引用渲染（S3 已生效）
  human_review: ${FEATURES_HUMAN_REVIEW:-false}            # S6 HITL：默认关，开关关时主图严格 7 节点
  auto_approve_review: ${AUTO_APPROVE_REVIEW:-true}        # 开了 human_review 仍需显式关这里才会 interrupt
  entity_guard: ${FEATURES_ENTITY_GUARD:-true}             # S10 同名实体消歧：拒绝「另一个同名实体」的文档
  conflict_annotation: ${FEATURES_CONFLICT_ANNOTATION:-true}  # S10 同栏目事实冲突标注（只在结构化路径生效）
  # V2 多 Agent 改造开关：false = 旧的单一 analyst 节点（回滚路径）；true = 4 个专职栏目节点
  multi_agent: ${FEATURES_MULTI_AGENT:-false}
  # V2 后处理开关：行业竞品识别/对比矩阵、新闻时效标注/事件去重。默认关，不影响报告文本与评测基线
  postprocess: ${FEATURES_POSTPROCESS:-false}

report:
  # 报告结构保持与原版一致，便于做前后对比
  # 前四个渲染成正文栏目标题；最后一个 References 不参与 zip，仅作约定保留
  headings:
    - 公司概况
    - 行业概况
    - 财务概况
    - 新闻动态
    - References
  max_references: 10             # 每栏目最多输出的结论条数；每条结论必须带行内引用
